[project]
name = "noveltrad"
version = "0.1.0"
description = "Local AI-assisted literary translation application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Marc" }]
dependencies = [
    "streamlit==1.61.1",
    "httpx==0.28.1",
    "lxml==6.1.1",
    "beautifulsoup4==4.15.0",
    "mammoth==1.12.0",
    "markdown-it-py==4.2.0",
    "linkify-it-py==2.1.0",
    "Pillow==12.3.0",
    "lingua-language-detector==2.2.0",
    "cryptography==50.0.0",
    "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
    "pip-audit==2.10.1",
    "pip-licenses==5.5.5",
]
ui-tests = [
    "playwright==1.62.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noveltrad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
