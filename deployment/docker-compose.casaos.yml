name: noveltrad

services:
  app:
    image: noveltrad:latest
    container_name: noveltrad
    restart: unless-stopped
    env_file:
      - /DATA/AppData/noveltrad/.env
    environment:
      PORT: 8501
      HOST: 0.0.0.0
      OUTPUT_DIR: /app/translated_files
      API_ENDPOINT: ${API_ENDPOINT:-http://host.docker.internal:11434/api/generate}
      OLLAMA_API_ENDPOINT: ${OLLAMA_API_ENDPOINT:-http://host.docker.internal:11434/api/generate}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen2.5:1.5b}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
    ports:
      - "0.0.0.0:8501:8501"
    volumes:
      - noveltrad_data:/app/data
      - noveltrad_files:/app/translated_files
      - noveltrad_logs:/app/logs
      # Same file as env_file: UI "Save to .env" must write here or settings
      # vanish on container recreate (TranslateBooksWithLLMs keeps settings
      # because it writes the host cwd .env; Docker needs this bind mount).
      - /DATA/AppData/noveltrad/.env:/app/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  noveltrad_data:
    external: true
  noveltrad_files:
    external: true
  noveltrad_logs:
    external: true

x-casaos:
  author: self
  category: Books
  hostname: 192.168.1.98
  icon: http://192.168.1.98:8501/static/noveltrad-logo.svg
  index: /
  is_uncontrolled: false
  main: app
  port_map: "8501"
  scheme: http
  store_app_id: noveltrad
  title:
    custom: "NovelTrad"
    en_us: "NovelTrad"
